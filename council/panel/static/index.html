<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{title}}</title>
<link rel="stylesheet" href="{{base}}/static/panel.css">
<script src="{{base}}/static/panel.js" defer></script>
<script src="{{base}}/static/schema.js" defer></script>
<script src="{{base}}/static/today.js" defer></script>
<script src="{{base}}/static/health.js" defer></script>
<script src="{{base}}/static/notes.js" defer></script>
<script src="{{base}}/static/map.js" defer></script>
<script src="{{base}}/static/releases.js" defer></script>
</head>
<body class="sayfa" data-base="{{base}}" data-texts="{{ui}}">
<div class="cerceve">
<header class="ust">
<div class="kimlik">
<svg class="amblem-kucuk" viewBox="0 0 400 400" role="img" aria-label="{{brand}}"><defs><mask id="kesik-ust" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400"><rect width="400" height="400" fill="#fff"/><path transform="translate(200 200)" d="M-56 0A56 56 0 0 1 56 0A56 56 0 0 0 168 0" fill="none" stroke="#000" stroke-width="48"/></mask></defs><g fill="none" stroke-width="28"><circle cx="200" cy="200" r="112" stroke="#E8421F" mask="url(#kesik-ust)"/><path transform="translate(200 200) rotate(45)" stroke="#111416" d="M168 0A168 168 0 1 1 0 -168"/><path transform="translate(200 200)" stroke="#111416" d="M-56 0A56 56 0 0 1 56 0A56 56 0 0 0 168 0"/></g></svg>
<span class="marka">{{brand}}</span>
</div>
<nav aria-label="{{nav_label}}">
<a href="#sema">{{nav_schema}}</a>
<a href="#bugun">{{nav_today}}</a>
<a href="#saglik">{{nav_health}}</a>
<a href="#harita">{{nav_map}}</a>
<a href="#notlar">{{nav_notes}}</a>
<a href="#guncellemeler">{{nav_releases}}</a>
</nav>
<p class="baglanti" id="baglanti" role="status" aria-live="polite"></p>
<form method="post" action="{{base}}/logout"><button type="submit" class="ikincil">{{sign_out}}</button></form>
</header>
<main id="bolum"></main>
</div>
</body>
</html>
