[project]
name = "council-memory"
version = "0.2.1"
description = "COUNCIL: a source-backed, self-hosted memory system for AI agents (MCP + hooks)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
council = "council.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["council", "council.panel"]

[tool.setuptools.package-data]
council = ["static/*"]
"council.panel" = ["static/*", "static/fonts/*", "releases.json"]
