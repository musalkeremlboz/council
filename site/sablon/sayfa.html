<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$baslik</title>
<meta name="description" content="$aciklama">
<link rel="canonical" href="$kanonik">
$alternatifler
<meta property="og:type" content="website">
<meta property="og:site_name" content="COUNCIL">
<meta property="og:title" content="$baslik">
<meta property="og:description" content="$aciklama">
<meta property="og:url" content="$kanonik">
<meta property="og:image" content="$og_gorsel">
<meta property="og:locale" content="$og_yerel">
<link rel="icon" href="${varlik}logo/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="${varlik}logo/council-ikon-180.png">
<link rel="preload" href="${varlik}glifler.json" as="fetch" crossorigin>
<link rel="stylesheet" href="${varlik}css/tokens.css">
<link rel="stylesheet" href="${varlik}css/council.css">
<link rel="stylesheet" href="${varlik}css/site.css">
<script type="module" src="${varlik}js/site.js"></script>
</head>
<body>
<a class="s-atla" href="#icerik">$atla</a>
<header class="s-ust">
  <div class="s-ust__ic">
    <a class="s-logo" href="$ana" data-yazi-kur data-denetim-logo data-glifler="${varlik}glifler.json">$logo</a>
    <nav class="c-gezinme" aria-label="$gezinme_etiket">$gezinme</nav>
  </div>
</header>
<main id="icerik" class="s-sayfa">
$govde
</main>
<footer class="s-alt">
  <div class="s-alt__ic">
    <a class="s-alt__logo" href="$ana"><img class="ia" src="${varlik}logo/council-amblem.svg" alt="" width="24" height="24"><img class="ik" src="${varlik}logo/council-amblem-koyu.svg" alt="" width="24" height="24"><span>COUNCIL</span></a>
    <nav class="c-gezinme" aria-label="$altbilgi_etiket">$altbilgi_gezinme</nav>
    <p class="s-alt__lisans">$lisans</p>
  </div>
</footer>
</body>
</html>
