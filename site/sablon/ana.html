<div class="s-acilis">
  <h1 class="yazi-baslik-xl" data-yazi-kur data-glifler="${varlik}glifler.json">$slogan</h1>
  <p class="s-acilis__tanim yazi-govde-l">$tanim</p>
  <div class="s-yonerge">
    <p class="s-yonerge__onu yazi-govde">$kur_onu</p>
    <pre><code id="kur-cumlesi">$kur_cumlesi</code></pre>
    <div class="s-yonerge__eylem">
      <button type="button" class="c-dugme c-dugme--b c-dugme--kor" data-kopyala="kur-cumlesi" data-tamam="$kopyalandi" data-hata="$secin" aria-live="polite" hidden>$kopyala</button>
      <a class="c-dugme c-dugme--b c-dugme--ikincil" href="$github">GitHub</a>
    </div>
  </div>
</div>

<section id="cizgi-soz-bolum" data-denetim-sahne class="s-bolum s-bolum--cs" aria-label="$cs_etiket">
  <div class="s-cs">
    <figure class="s-cs__bicim" data-bicim="cizgi">
      <div class="s-cs__amblem" role="img" aria-label="$cs_etiket_cizgi">$cs_cizgi</div>
      <figcaption class="yazi-govde-k">$cs_ad_cizgi</figcaption>
    </figure>
    <figure class="s-cs__bicim" data-bicim="soz">
      <div class="s-cs__amblem" role="img" aria-label="$cs_etiket_soz">$cs_soz</div>
      <figcaption class="yazi-govde-k">$cs_ad_soz</figcaption>
    </figure>
  </div>
  <div class="s-cs__secici" role="group" aria-label="$cs_secici" hidden>
    <button type="button" class="c-dugme c-dugme--k" data-bicim="cizgi" aria-pressed="true">$cs_ad_cizgi</button>
    <button type="button" class="c-dugme c-dugme--k c-dugme--ikincil" data-bicim="soz" aria-pressed="false">$cs_ad_soz</button>
  </div>
</section>

<section id="ne-ise-yarar" class="s-bolum" aria-labelledby="ne-ise-yarar-b">
  <h2 id="ne-ise-yarar-b" class="yazi-baslik-m">$yarar_baslik</h2>
  <p class="s-bolum__onu yazi-govde-l">$yarar_onu</p>
  <ul class="s-yarar">
$yarar_maddeler
  </ul>
</section>

<div class="s-bolum s-bolum--tur"><h2 id="kurul-b" class="yazi-baslik-m">$kurul_baslik</h2></div>
<section class="s-tur" id="kurul-turu" aria-labelledby="kurul-b">
  <div class="s-tur__sahne">
    <figure class="s-tur__gorsel">
      <svg class="s-tur__svg" viewBox="-120 -70 640 540" role="img" aria-label="$kurul_gorsel">
        <image class="ia" href="${varlik}logo/council-amblem.svg" x="0" y="0" width="400" height="400"/>
        <image class="ik" href="${varlik}logo/council-amblem-koyu.svg" x="0" y="0" width="400" height="400"/>
      </svg>
    </figure>
    <div class="s-tur__metin"><div class="s-tur__paneller">
$kurul_paneller
    </div></div>
  </div>
</section>
<div id="kurul-sonu" class="s-tur-sonu"><p class="yazi-kod">$kurul_son</p></div>

<section id="urunler" class="s-bolum" aria-labelledby="urunler-b">
  <h2 id="urunler-b" class="yazi-baslik-m">$urunler_baslik</h2>
  <ul class="s-urunler">
$urunler
  </ul>
</section>
